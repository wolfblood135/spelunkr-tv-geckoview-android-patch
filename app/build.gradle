plugins {
    id "com.android.application"
}

android {
    namespace "tv.spelunkr.gecko"
    compileSdk 36

    defaultConfig {
        // Different from the official app (tv.spelunkr.app), so both can be installed side by side
        applicationId "tv.spelunkr.gecko"
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "boolean", "KIOSK", "false"
        buildConfigField "String", "START_URL", "\"https://spelunkr.tv/\""
    }

    buildFeatures {
        buildConfig true
    }

    // Three builds (GeckoView 145+ requires Android 8 / API 26):
    //   modern -> GeckoView 146, Android 8.0 and newer
    //   legacy -> GeckoView 144 (last one for Android 5-7), Android 5.0 and newer
    //   kiosk  -> legacy engine as a home-screen app for weak boxes: boots straight into
    //             Spelunkr, uses the site's lighter "modern" skin, caps rendering at 30 fps
    flavorDimensions "engine"
    productFlavors {
        modern {
            dimension "engine"
            minSdk 26
        }
        legacy {
            dimension "engine"
            minSdk 21
            versionNameSuffix "-legacy"
        }
        kiosk {
            dimension "engine"
            minSdk 21
            applicationIdSuffix ".kiosk"
            versionNameSuffix "-kiosk"
            buildConfigField "boolean", "KIOSK", "true"
            buildConfigField "String", "START_URL", "\"https://spelunkr.tv/?skin=modern\""
        }
    }

    // GeckoView ships native code for every CPU; one APK per CPU keeps each file small
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded without setting up a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Pinned: GeckoView 159+ needs compileSdk 37 and Android Gradle plugin 9.1+.
    // 146 builds with this setup and is plenty modern for the site.
    modernImplementation "org.mozilla.geckoview:geckoview:146.+"
    legacyImplementation "org.mozilla.geckoview:geckoview:144.+"
    kioskImplementation "org.mozilla.geckoview:geckoview:144.+"
}
