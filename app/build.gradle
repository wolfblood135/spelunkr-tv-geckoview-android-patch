plugins {
    id "com.android.application"
}

android {
    namespace "tv.spelunkr.gecko"
    compileSdk 36

    defaultConfig {
        // Different from the official app (tv.spelunkr.app), so both can be installed side by side
        applicationId "tv.spelunkr.gecko"
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Two builds, because GeckoView 145+ requires Android 8 (API 26):
    //   modern -> latest GeckoView, Android 8.0 and newer
    //   legacy -> GeckoView 144 (last one for Android 5-7), Android 5.0 and newer
    flavorDimensions "engine"
    productFlavors {
        modern {
            dimension "engine"
            minSdk 26
        }
        legacy {
            dimension "engine"
            minSdk 21
            versionNameSuffix "-legacy"
        }
    }

    // GeckoView ships native code for every CPU; one APK per CPU keeps each file small
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded without setting up a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // If a newer GeckoView ever breaks the build, pin it here, e.g. "org.mozilla.geckoview:geckoview:146.+"
    modernImplementation "org.mozilla.geckoview:geckoview:+"
    legacyImplementation "org.mozilla.geckoview:geckoview:144.+"
}
